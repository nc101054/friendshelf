{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>自留地</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@300;400;500&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.47.0/tabler-icons.min.css">
    <style>
        :root {
            --bg: #1c1f26;
            --bg-nav: #15171c;
            --bg-card: #24272e;
            --border: #2e323b;
            --text-primary: #f0ede6;
            --text-secondary: #9a9ca3;
            --text-muted: #6c6e76;
            --accent: #c9a06a;
            --avatar-bg: #3d4654;
            --avatar-text: #d4d6db;
        }
        * { box-sizing: border-box; }
        body {
            font-family: "Noto Sans SC", system-ui, sans-serif;
            max-width: 520px;
            margin: 0 auto;
            padding: 0;
            background: var(--bg);
            color: var(--text-primary);
        }
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 22px;
            background: var(--bg-nav);
            border-bottom: 1px solid var(--border);
        }
        nav .links { display: flex; gap: 18px; }
        nav a { color: var(--text-secondary); text-decoration: none; font-size: 14px; }
        nav a:hover { color: var(--text-primary); }
        nav button {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 13px;
            padding: 0;
            font-family: inherit;
        }
        .page { padding: 4px 22px 50px; }
        h2 {
            font-family: "Noto Serif SC", serif;
            font-weight: 500;
            font-size: 25px;
            margin: 16px 0 2px;
            color: var(--text-primary);
        }
        .subtitle {
            font-size: 13px;
            color: var(--text-muted);
            letter-spacing: 1px;
            margin: 0 0 6px;
        }
        .accent-line {
            width: 32px;
            height: 2px;
            background: var(--accent);
            margin-bottom: 28px;
        }
        .card {
            background: var(--bg-card);
            border-radius: 8px;
            padding: 22px 24px;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }
        .kind-tag {
            display: flex;
            align-items: center;
            gap: 7px;
            font-size: 12px;
            letter-spacing: 1px;
            color: var(--accent);
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .post-title {
            font-family: "Noto Serif SC", serif;
            font-size: 19px;
            font-weight: 500;
            margin-bottom: 10px;
            color: var(--text-primary);
        }
        .post-thoughts {
            color: var(--text-secondary);
            line-height: 1.8;
            margin-bottom: 18px;
            font-size: 14px;
        }
        .post-meta {
            font-size: 12px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding-top: 14px;
            border-top: 1px solid var(--border);
        }
        .author-badge {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            font-weight: 500;
            color: var(--text-secondary);
        }
        .avatar {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: var(--avatar-bg);
            color: var(--avatar-text);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
            font-weight: 500;
        }
        input:not([type="checkbox"]), textarea, select {
            display: block;
            width: 100%;
            padding: 10px 12px;
            margin: 8px 0;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text-primary);
            font-family: inherit;
        }
        input[type="checkbox"] { width: auto; margin-right: 8px; }
        textarea { min-height: 100px; }
        button {
            padding: 10px 18px;
            background: var(--accent);
            color: #1c1f26;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
        }
        button:hover { opacity: 0.9; }
        a { color: var(--accent); }
        p { font-size: 14px; color: var(--text-secondary); }

        @media (max-width: 480px) {
            nav { padding: 14px 16px; flex-wrap: wrap; gap: 8px; }
            .page { padding: 4px 16px 50px; }
            h2 { font-size: 21px; }
            .card { padding: 16px 18px; }
            .post-title { font-size: 16px; }
        }
        .brush-title {
            font-family: 'Ma Shan Zheng', cursive;
            font-size: 40px;
            font-weight: 400;
            color: var(--text-primary);
            margin: 16px 0 0;
            line-height: 1.2;
        }
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <nav>
        <div class="links">
            <a href="{% url 'index' %}">主页</a>
            <a href="{% url 'my_posts' %}">我的记录</a>
            <a href="{% url 'new_post' %}">记一笔</a>
        </div>
        <form method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit" style="background:none;color:var(--text-muted);padding:0;">登出</button>
        </form>
    </nav>
    {% endif %}
    <div class="page">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
